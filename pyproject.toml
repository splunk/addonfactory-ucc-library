[tool.poetry]
name = "splunktaucclib"
version = "8.2.0"
description = ""
authors = ["Splunk <addonfactory@splunk.com>"]
license = "APACHE-2.0"

[tool.poetry.dependencies]
python = ">=3.7,<3.14"
defusedxml = ">=0.7"
# Keep the Python 3.7-3.9 integration runtime on the last urllib3 branch
# compatible with those interpreters, while using the current secure branch
# on Python 3.10+. The runtime test matrix also exercises 1.26.19 and 2.6.3
# because older Splunk hosts may provide those versions at runtime.
urllib3 = [
    { version = ">=1.26.20,<2", python = ">=3.7,<3.10" },
    { version = ">=2.7.0,<3", python = ">=3.10,<3.14" },
]
PySocks = "^1.7.1"
splunk-sdk = ">=2.0.2"
solnlib = ">=5"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
splunk-add-on-ucc-framework = ">=5.53.0"
requests = "^2.31.0"

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.masonry.api"
