[tool.poetry]
name = "splunktaucclib"
version = "8.2.0"
description = ""
authors = ["Splunk <addonfactory@splunk.com>"]
license = "APACHE-2.0"

[tool.poetry.dependencies]
python = ">=3.7,<3.14"
defusedxml = ">=0.7"
# Keep the UCC library compatible with the legacy Splunk runtime dependency
# while allowing downstream add-ons to select a modern urllib3 copy at runtime.
# The consuming add-on remains responsible for pinning and packaging the exact
# version selected for each Python/OpenSSL environment.
urllib3 = ">=1.26.19,<3"
PySocks = "^1.7.1"
splunk-sdk = ">=2.0.2"
solnlib = ">=5"
[tool.poetry.group.dev.dependencies]
pytest = ">=7"
splunk-add-on-ucc-framework = ">=5.53.0"
requests = "^2.31.0"

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.masonry.api"
